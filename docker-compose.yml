version: "3.8"

services:
  # Backend Service
  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
    container_name: noblesse-backend
    profiles:
      - backend
      - full
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=production
      - SPRING_DATASOURCE_URL=jdbc:sqlite:/data/inventaire.db
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SERVER_PORT=8080
      - DEBUG=false
    volumes:
      - ./data:/data
      - ./backend:/app/backend
    networks:
      - noblesse-network
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:8080/actuator/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # Frontend Service
  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    container_name: noblesse-frontend
    profiles:
      - frontend
      - full
    ports:
      - "4200:4200"
    environment:
      - NODE_ENV=production
    depends_on:
      - backend
    networks:
      - noblesse-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:4200",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

networks:
  noblesse-network:
    driver: bridge

volumes:
  data:
    driver: local
